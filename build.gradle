plugins {
    id 'java-platform'
    id 'maven-publish'
}

group = 'pl.es8it.mas.bom'
version = '1.0.0'

repositories {
    mavenCentral()
}

javaPlatform {
    allowDependencies()
}

dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.javaPlatform
        }
    }
}
